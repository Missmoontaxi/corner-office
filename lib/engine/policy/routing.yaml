# Task routing. Caps include thinking tokens. Values marked "proposed" come from the 2026-10-14 p95
# spike (docs/spikes/2026-10-14-models-and-structured-output.md) and wait for Paula's approval;
# until then the plan's placeholders apply.
version: 2026-10-17.1
modes: { fast: text.small, balanced: text.mid, deep: text.frontier }
limits: { max_input_tokens: 20000 }
tasks:
  desk.brief.precompute: { alias: text.mid,   effort: medium, max_output: 6000, schema: BriefV1 }   # proposed 2200
  desk.brief.live:       { alias: mode,       effort: low,    max_output: 4000, schema: BriefV1 }   # proposed 3400
  desk.ask.precompute:   { alias: text.mid,   effort: low,    max_output: 1200 }
  guard.screen:          { alias: text.small, effort: low,    max_output: 400, schema: ScreenVerdict } # proposed 600
  judge.online:          { alias: text.small, cross_vendor: true, effort: low, max_output: 600 }
  judge.ci:              { alias: text.small, cross_vendor: true, effort: low, max_output: 600 }
  eval.fixture:          { alias: text.frontier, effort: medium, max_output: 8000 }
timeouts:
  first_event_ms: 8000     # floor; measured p95 was 5.1s (Opus)
  total_ms: 30000          # floor for Claude routes
  total_ms_openai: 42000   # Sol measured p95 37s plus 5s
