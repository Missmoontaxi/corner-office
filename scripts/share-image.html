<!doctype html>
<!-- Source for public/og/corner-office-share.jpg, the 1200 by 630 link preview. Open in a browser, screenshot the
     #b card at 1200 by 630 and save as a JPEG. Uses the wide office painting and the desk headline font. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000}
.card{position:relative;overflow:hidden;width:1200px;height:630px;color:#fff;font-family:Inter,system-ui,sans-serif;background:#111 url("../public/art/office-wide-art-v2.webp") center 42%/cover no-repeat}
.t{font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:-.01em;margin:0;line-height:1}
.a::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.05) 75%)}
.a .txt{position:absolute;z-index:1;left:72px;top:50%;transform:translateY(-50%);width:720px}
.a .t{font-size:104px}.a p{font-size:30px;line-height:1.3;margin:22px 0 0;color:rgba(255,255,255,.85)}
.a .k{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc;margin:0 0 18px}
.b::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgba(0,0,0,.72),rgba(0,0,0,.35) 70%,rgba(0,0,0,.15))}
.b .txt{position:absolute;z-index:1;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.b .t{font-size:112px;text-shadow:0 4px 24px rgba(0,0,0,.5)}.b p{font-size:30px;margin:18px 0 0;color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.b .pill{margin-top:30px;font-size:22px;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
</style></head><body>
<div class="card b" id="b"><div class="txt"><h1 class="t">Corner Office</h1><p>An AI chief of staff demo by Paula McMahon</p><div class="pill">Every card flips to a receipt</div></div></div>
</body></html>
