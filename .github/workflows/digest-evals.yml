name: Digest evals
# Paula's "Run workflow" button. Smoke by default (the production primary on all current cases, about $1);
# tick "full" for both mid-tier models. Runs on the direct drivers with the capped CI eval keys.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run both mid-tier models (full matrix)"
        type: boolean
        default: false
      cases:
        description: "Only these cases, comma separated (blank for all)"
        type: string
        default: ""
permissions:
  contents: read
concurrency: { group: digest-evals, cancel-in-progress: false }
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check every must-surface fact is in its day file
        run: pnpm eval:check-days
      - name: Run the evals
        env:
          DRIVER: direct
          ANTHROPIC_EVAL_KEY: ${{ secrets.ANTHROPIC_EVAL_KEY }}
          OPENAI_EVAL_KEY: ${{ secrets.OPENAI_EVAL_KEY }}
          FULL: ${{ inputs.full }}
          CASES: ${{ inputs.cases }}
        run: pnpm eval $([ "$FULL" = "true" ] && echo --full) $CASES
      - name: Summary
        if: always()
        run: |
          if [ -f evals/results/local/latest.json ]; then pnpm exec tsx scripts/eval-view.ts --markdown >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: digest-evals
          path: evals/results/local/
          if-no-files-found: ignore
